<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vistoria Mac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a; --bg-glow:rgba(205,245,90,.07);
  --surface:#151515; --surface-2:#1e1e1e; --surface-3:#262626;
  --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.14);
  --text:#f5f5f2; --muted:#8d8d89; --faint:#5a5a57;
  --accent:#d4f65c; --accent-ink:#0b0b0b; --accent-soft:rgba(212,246,92,.13);
  --ok:#c4f05a; --ok-soft:rgba(196,240,90,.12);
  --fail:#ff6b5e; --fail-soft:rgba(255,107,94,.12);
  --warn:#ffc548; --warn-soft:rgba(255,197,72,.12);
  --key:#1c1c1c; --key-line:#2c2c2c; --key-text:#b9b9b4;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 20px 40px -24px rgba(0,0,0,.6);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f2f2ef; --bg-glow:rgba(94,240,122,.16);
  --surface:#ffffff; --surface-2:#f4f4f1; --surface-3:#ebebe7;
  --line:rgba(0,0,0,.06); --line-strong:rgba(0,0,0,.12);
  --text:#121212; --muted:#7a7a75; --faint:#b0b0aa;
  --accent:#5ef07a; --accent-ink:#0b0b0b; --accent-soft:rgba(94,240,122,.18);
  --ok:#1fae46; --ok-soft:rgba(31,174,70,.1);
  --fail:#e5483b; --fail-soft:rgba(229,72,59,.09);
  --warn:#d48a00; --warn-soft:rgba(212,138,0,.1);
  --key:#ffffff; --key-line:#dcdcd6; --key-text:#55554f;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 16px 32px -20px rgba(0,0,0,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Manrope",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(1200px 520px at 50% -180px,var(--bg-glow),transparent 70%);background-repeat:no-repeat}
button,input,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- topo ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:22px 28px 80px}
.top{display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.02em;cursor:pointer;white-space:nowrap}
.logo{width:34px;height:34px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.logo svg.i{width:19px;height:19px;stroke-width:2.6}
.spacer{flex:1}
.seg{display:flex;padding:4px;gap:2px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;white-space:nowrap}
.seg button svg.i{width:15px;height:15px}
.seg button.on{background:var(--surface-3);color:var(--text)}
.ring{--p:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-3) 0)}
.ring span{width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.topprog{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}

.navbar{margin:18px 0 0;display:flex;justify-content:space-between;gap:4px;padding:5px;border-radius:999px;background:var(--surface);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.navbar::-webkit-scrollbar{display:none}
.navbar a{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;color:var(--muted);text-decoration:none;cursor:pointer;white-space:nowrap;font-size:13.5px;font-weight:500;position:relative;transition:background .15s,color .15s}
.navbar a:hover{color:var(--text)}
.navbar a.active{background:var(--accent);color:var(--accent-ink);font-weight:600}
.navbar a .st{width:6px;height:6px;border-radius:50%;background:transparent;margin-left:-1px}
.navbar a .st:not(.ok):not(.fail):not(.warn){display:none}
.navbar a svg.i{width:16px;height:16px}
.navbar a .st.ok{background:var(--ok)} .navbar a .st.fail{background:var(--fail)} .navbar a .st.warn{background:var(--warn)}
.navbar a.active .st{background:var(--accent-ink)!important;opacity:.55}
.navbar .sep{width:1px;background:var(--line-strong);margin:6px 6px;flex:none}

/* ---------- cabeçalho de página ---------- */
.ph{display:flex;align-items:center;gap:16px;margin:34px 0 22px}
.circle{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-strong);background:transparent;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--text)}
.circle:hover{background:var(--surface)}
.ph h1{margin:0;font-size:36px;font-weight:500;letter-spacing:-.035em;line-height:1.1}
.ph p{margin:4px 0 0;color:var(--muted)}
.ph .step{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.eyebrow{color:var(--muted);font-size:14px;margin:34px 0 4px}
.hello{font-size:44px;font-weight:500;letter-spacing:-.04em;margin:0 0 24px;line-height:1.1}

/* ---------- cards ---------- */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow);margin-bottom:14px;position:relative}
.grid>.card{margin-bottom:0}
.card h3{margin:0 0 14px;font-size:16px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card .corner{position:absolute;top:16px;right:16px;width:36px;height:36px}
.label{color:var(--muted);font-size:13px}
.num{font-size:40px;font-weight:600;letter-spacing:-.045em;line-height:1.05}
.num small{font-size:20px;color:var(--muted);font-weight:500;letter-spacing:-.02em}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:transform .08s,background .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.dark{background:var(--text);border-color:var(--text);color:var(--bg)}
.btn.lg{padding:14px 24px;font-size:15px}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.okb{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.failb{background:var(--fail-soft);border-color:var(--fail);color:var(--fail)}
.btn svg.i{width:16px;height:16px}

.note{border-radius:16px;padding:13px 16px;margin:10px 0;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.note svg.i{margin-top:2px}
.note.bad{background:var(--fail-soft);color:var(--fail)} .note.bad b{color:var(--fail)}
.note.warn{background:var(--warn-soft)} .note.warn svg.i{color:var(--warn)}
.note.good{background:var(--ok-soft)} .note.good svg.i{color:var(--ok)}
.note.info{background:var(--surface-2)} .note.info svg.i{color:var(--muted)}
.note.bad span,.note.warn span,.note.good span{color:var(--text)}

.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.fail{background:var(--fail-soft);color:var(--fail)}
.tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.pending{background:var(--surface-2);color:var(--muted)}
.tag.na{background:var(--surface-2);color:var(--muted)}

.kv{display:grid;grid-template-columns:minmax(150px,38%) 1fr;gap:0}
.kv div{padding:12px 0;border-bottom:1px solid var(--line)}
.kv div:nth-child(odd){color:var(--muted)}
.kv div:nth-last-child(-n+2){border-bottom:0}
pre{background:var(--surface-2);padding:14px;border-radius:14px;overflow:auto;max-height:340px;font-size:12px}
details summary{cursor:pointer;color:var(--muted)}

.bar{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s}
.ticks{display:flex;gap:3px;align-items:flex-end;height:30px}
.ticks i{flex:1;border-radius:2px;background:var(--surface-3);height:100%}
.ticks i.on{background:var(--accent)} .ticks i.fail{background:var(--fail)} .ticks i.warn{background:var(--warn)}

.gauge{--p:0;--c:var(--accent);width:118px;height:118px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface-3) 0)}
.gauge>div{width:96px;height:96px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.1}
.gauge b{font-size:26px;letter-spacing:-.04em;font-weight:600}
.gauge small{display:block;font-size:11px;color:var(--muted)}

/* cards de teste na home */
.tcard{cursor:pointer;transition:transform .12s,border-color .15s;display:flex;flex-direction:column;gap:14px;min-height:150px}
.tcard:hover{transform:translateY(-2px);border-color:var(--line-strong)}
.ticon{width:42px;height:42px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center}
.tcard .t{font-weight:600;font-size:15.5px;letter-spacing:-.01em}
.tcard .d{color:var(--muted);font-size:13px;line-height:1.4}
.tcard .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.tcard.hl{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tcard.hl .d{color:rgba(0,0,0,.6)} .tcard.hl .ticon{background:rgba(0,0,0,.1)} .tcard.hl .circle{border-color:rgba(0,0,0,.2);color:var(--accent-ink)}
.section-t{display:flex;align-items:baseline;gap:10px;margin:30px 0 14px}
.section-t h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.02em}

/* resultado */
.verdict{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;padding:16px 16px 16px 22px;border-radius:24px;background:var(--surface);border:1px solid var(--line)}
.verdict .q{font-weight:600;margin-right:6px}

/* teclado */
.kb{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);padding:16px;border-radius:20px;user-select:none}
.kr{display:flex;gap:6px}
.k{flex:1 1 0;min-width:0;height:50px;background:var(--key);border:1px solid var(--key-line);border-radius:9px;display:flex;align-items:flex-end;justify-content:flex-start;padding:6px 8px;font-size:12.5px;color:var(--key-text);transition:background .12s,color .12s,transform .06s;box-shadow:0 1px 0 var(--key-line)}
.k.fn{height:32px;font-size:11px}
.k.on{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.k.down{background:var(--accent);color:var(--accent-ink);transform:translateY(1px)}
.k.opt{border-style:dashed;opacity:.6}
.stack{flex:1 1 0;display:flex;flex-direction:column;gap:3px}
.stack .k{height:23.5px;padding:1px 6px;align-items:center;justify-content:center}
.keylog{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);min-height:20px;margin-top:12px}

/* trackpad */
.tp{position:relative;height:400px;border-radius:20px;overflow:hidden;background:var(--surface-2);touch-action:none;cursor:crosshair}
.tp canvas{position:absolute;inset:0;width:100%;height:100%}
.tp .hint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:var(--faint);pointer-events:none}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:14px}
.chk{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;background:var(--surface-2);font-size:14px;color:var(--muted)}
.chk .b{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none}
.chk.done{color:var(--text)} .chk.done .b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk .b svg.i{width:12px;height:12px;stroke-width:3}

/* tela cheia */
#screen{position:fixed;inset:0;z-index:99;display:none;cursor:none}
#screen .lbl{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;padding:8px 16px;border-radius:99px;font-size:13px;transition:opacity .4s;backdrop-filter:blur(8px)}
.swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.swatches i{width:44px;height:30px;border-radius:9px;border:1px solid var(--line-strong)}

/* áudio */
.sides{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:10px;margin-top:16px}
.side{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:20px;padding:22px 18px;cursor:pointer;text-align:center;transition:all .15s}
.side b{display:block;font-size:20px;letter-spacing:-.02em;font-weight:600}
.side span{color:var(--muted);font-size:13px}
.side.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .side.on span{color:rgba(0,0,0,.6)}
.eq{display:flex;gap:4px;align-items:flex-end;height:34px}
.eq i{width:5px;border-radius:3px;background:var(--accent);height:20%;transition:height .1s}
input[type=range]{accent-color:var(--accent)}

.meter{height:14px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .06s}
video{width:100%;max-width:720px;border-radius:20px;background:#000;transform:scaleX(-1);display:block}

/* checklist */
.mitem{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.mitem:last-child{border-bottom:0}
.mitem .t{flex:1;font-weight:500}
.mitem .t small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.mini{display:flex;gap:4px;padding:3px;border-radius:99px;background:var(--surface-2)}
.mini button{border:0;background:none;padding:6px 12px;border-radius:99px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:500}
.mini button.ok{background:var(--ok);color:#0b0b0b} .mini button.fail{background:var(--fail);color:#fff} .mini button.na{background:var(--surface-3);color:var(--text)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--surface-2);font-size:13px;margin:3px 4px 3px 0}

/* relatório */
.score{display:flex;gap:26px;align-items:center}
.score .big{font-size:46px;font-weight:600;letter-spacing:-.045em;line-height:1}
.rl{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.rl:last-child{border-bottom:0}
.rl .ticon{width:36px;height:36px;border-radius:12px}
.rl .n{flex:1;font-weight:500}
.rl .n small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
textarea{width:100%;min-height:90px;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:14px;resize:vertical}

@media (max-width:980px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.wrap{padding:16px}.g4,.g3,.g2{grid-template-columns:1fr}.hello{font-size:32px}.ph h1{font-size:28px}.sides{grid-template-columns:1fr}.topprog .lbl{display:none}.seg button{padding:7px 10px}.seg button .tl{display:none}.navbar{justify-content:flex-start}}
@media print{.navbar,.verdict,.btn,.seg,.circle{display:none!important}body{background:#fff;color:#000}.card{box-shadow:none;border-color:#ddd}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand" id="brand"><div class="logo"></div>Vistoria Mac</div>
    <div class="spacer"></div>
    <div class="topprog"><span class="lbl" id="progLbl"></span><div class="ring" id="ring"><span id="ringN"></span></div></div>
    <div class="seg" id="theme"></div>
  </header>
  <nav class="navbar" id="nav"></nav>
  <main id="main"></main>
</div>
<div id="screen"><div class="lbl" id="screenLbl"></div></div>

<script src="info.js" onerror="window.SYSINFO=null"></script>
<script>
"use strict";
/* ================= ícones ================= */
const ICONS={
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  chip:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  keyboard:'<rect x="2" y="6" width="20" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>',
  monitor:'<rect x="2" y="4" width="20" height="13" rx="2.5"/><path d="M8 21h8M12 17v4"/>',
  trackpad:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M4 15h16M12 15v6"/>',
  volume:'<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/>',
  mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v4"/>',
  camera:'<path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/>',
  plug:'<path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 01-12 0zM12 18v4"/>',
  alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
  wifi:'<path d="M2 9a15 15 0 0120 0M5 12.5a10 10 0 0114 0M8.5 16a5 5 0 017 0M12 20h.01"/>',
  disk:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 14h18M7 17h.01M11 17h.01"/>',
  flame:'<path d="M12 2s5 5 5 10a5 5 0 01-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5z"/>',
  report:'<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h8M9 17h6"/>',
  arrow:'<path d="M7 17L17 7M8 7h9v9"/>', back:'<path d="M19 12H5M11 6l-6 6 6 6"/>', next:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>',
  check:'<path d="M5 12l5 5L20 7"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  play:'<path d="M7 4l13 8-13 8z"/>', pause:'<path d="M8 5v14M16 5v14"/>', repeat:'<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 01-3 3H3"/>',
  battery:'<rect x="2" y="7" width="18" height="10" rx="2.5"/><path d="M22 11v2M6 10v4M10 10v4"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15V5a2 2 0 012-2h8"/>', print:'<path d="M6 9V3h12v6M6 17H4v-6h16v6h-2M8 14h8v7H8z"/>',
  bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>', usb:'<path d="M12 2v14M8 6l4-4 4 4M7 12v2l5 3 5-3v-2"/><circle cx="12" cy="19" r="2"/>',
};
const ico=(n,cls="")=>`<svg class="i ${cls}" viewBox="0 0 24 24">${ICONS[n]||""}</svg>`;

/* ================= estado ================= */
const TESTS = [

  {id:"relatorio", name:"Relatório",        icon:"report",  home:1},

const STEPS = TESTS.filter(t=>!t.home);
const MANUAL = [
  ["charge","Carrega na tomada","Aparece o raio no ícone da bateria. Teste com o carregador que vem junto."],
  ["ports","Todas as portas USB-C funcionam","Use o painel acima: carregador e pendrive em cada porta."],
  ["magsafe","MagSafe (se tiver)","A luz do conector acende e o Mac carrega."],
  ["jack","Entrada de fone","Ligue um fone com fio e toque a música da etapa Som."],
  ["bt","Bluetooth acha aparelhos","Ajustes do Sistema → Bluetooth: aparece o seu celular ou fone?"],
  ["touchid","Touch ID (leitor de digital)","Ajustes do Sistema → Touch ID e Senha → Adicionar digital."],
  ["touchbar","Touch Bar (só no Pro que tem)","Deslize o dedo de ponta a ponta: tudo responde, sem mancha nem parte apagada."],
  ["backlight","Luz do teclado","Num lugar mais escuro, aumente e diminua pela Central de Controle."],
  ["brightness","Brilho da tela","Vai do mínimo ao máximo sem piscar."],
  ["hinge","Dobradiça firme","A tela fica parada em qualquer ângulo, sem estalo."],
  ["body","Carcaça inteira","Sem amassado, tampa fecha alinhada, sem parafuso faltando."],
  ["coating","Tela sem descascado","Com a tela apagada, procure manchas na película antirreflexo."],
  ["fan","Ventoinha silenciosa","Com vários apps abertos, não pode chiar nem raspar (o Air não tem ventoinha)."],
  ["serial","Número de série confere","O da Ficha do Mac bate com o gravado embaixo e com a caixa ou nota."],
  ["liquid","Sem sinal de líquido","Lanterna do celular dentro das portas: nada de ferrugem verde ou branca."],
  ["icloud","Sem conta do vendedor","Ajustes do Sistema → topo: ninguém logado e \"Buscar Mac\" desligado."],
  ["diag","Diagnóstico da Apple sem erro","Desligue, segure o botão de ligar até aparecer \"Opções\" e aperte ⌘D. Anote o código se aparecer."],
];
let state = {results:{}, manual:{}, details:{}, notes:""};
try{ const s = JSON.parse(localStorage.getItem("mbc-state")||"null"); if(s) state = Object.assign(state,s); }catch(e){}
function persist(){ try{ localStorage.setItem("mbc-state", JSON.stringify(state)); }catch(e){} }
function save(){ persist(); renderChrome(); }
function setResult(id, v){ state.results[id]=v; save(); const vd=document.querySelector(".verdict"); if(vd) vd.replaceWith(verdict(id)); }
function setDetail(id,txt){ state.details[id]=txt; save(); }

let theme="dark"; try{ theme=localStorage.getItem("mbc-theme")||"dark"; }catch(e){}
document.documentElement.dataset.theme=theme;

let current = (location.hash||"#inicio").slice(1);
if(!TESTS.find(t=>t.id===current)) current="inicio";
let cleanup = null;

const $ = (s,el=document)=>el.querySelector(s);
const h = (html)=>{ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; };
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LBL={ok:"Tudo certo",fail:"Com defeito",warn:"Atenção",pending:"Não testado",na:"Não tem"};
const note=(kind,html)=>`<div class="note ${kind}">${ico(kind==="good"?"check":kind==="info"?"info":"alert")}<span>${html}</span></div>`;

function statusOf(id){
  if(id==="extras"){
    const vals = MANUAL.map(m=>state.manual[m[0]]).filter(Boolean);
    if(vals.includes("fail")) return "fail";
    if(vals.length===MANUAL.length) return "ok";
    return vals.length ? "warn" : "pending";
  }
  return state.results[id] || "pending";
}
const doneCount=()=>STEPS.filter(t=>statusOf(t.id)!=="pending").length;

function renderChrome(){
  const nav=$("#nav"); nav.innerHTML="";
  TESTS.forEach((t,i)=>{
    if(t.adv && !TESTS[i-1].adv) nav.append(h(`<span class="sep"></span>`));
    if(t.id==="relatorio") nav.append(h(`<span class="sep"></span>`));
    const st=t.home?"":statusOf(t.id);
    const a=h(`<a class="${t.id===current?"active":""}">${t.id==="inicio"?ico("home"):""}${t.short||t.name}<span class="st ${st}"></span></a>`);
    a.onclick=()=>go(t.id); nav.append(a);
  });
  const act=nav.querySelector(".active"); if(act) act.scrollIntoView({block:"nearest",inline:"nearest"});
  const n=doneCount(), p=Math.round(100*n/STEPS.length);
  $("#ring").style.setProperty("--p",p); $("#ringN").textContent=n+"/"+STEPS.length; $("#progLbl").textContent="Progresso da vistoria";
  const th=$("#theme"); th.innerHTML="";
  [["light","sun","Claro"],["dark","moon","Escuro"]].forEach(([k,ic,l])=>{ const b=h(`<button class="${theme===k?"on":""}" title="${l}">${ico(ic)}<span class="tl">${l}</span></button>`);
    b.onclick=()=>{ theme=k; document.documentElement.dataset.theme=k; try{localStorage.setItem("mbc-theme",k);}catch(e){} renderChrome(); if(current==="trackpad") go("trackpad"); }; th.append(b); });
}
function pageHead(m,id,sub){
  const t=TESTS.find(x=>x.id===id), idx=STEPS.indexOf(t);
  const el=h(`<div class="ph"><button class="circle" title="Voltar ao início">${ico("back")}</button>
    <div><h1>${t.name}</h1>${sub?`<p>${sub}</p>`:""}</div>${idx>=0?`<span class="step">${t.adv?"Avançado · ":""}Etapa ${idx+1} de ${STEPS.length}</span>`:""}</div>`);
  el.querySelector(".circle").onclick=()=>go("inicio");
  m.append(el);
}
function nextOf(id){ const i=TESTS.findIndex(t=>t.id===id); return TESTS[i+1]; }
function verdict(id){
  const st=state.results[id], nx=nextOf(id);
  const el=h(`<div class="verdict"><span class="q">Como foi?</span>
    <button class="btn ${st==="ok"?"okb":""}">${ico("check")}Tudo certo</button>
    <button class="btn ${st==="fail"?"failb":""}">${ico("x")}Tem defeito</button>
    <span class="spacer"></span>${nx?`<button class="btn primary">${nx.id==="relatorio"?"Ver relatório":"Próximo: "+nx.name}${ico("next")}</button>`:""}</div>`);
  const [b1,b2,b3]=el.querySelectorAll("button");
  b1.onclick=()=>setResult(id,"ok"); b2.onclick=()=>setResult(id,"fail");
  if(b3) b3.onclick=()=>go(nx.id);
  return el;
}
function go(id){
  if(cleanup){ try{cleanup();}catch(e){} cleanup=null; }
  current=id; history.replaceState(null,"","#"+id);
  const main=$("#main"); main.innerHTML="";
  PAGES[id](main);
  renderChrome(); window.scrollTo(0,0);
}

/* ================= ficha do mac ================= */
const BATT_PT={"good":"Boa","normal":"Boa","fair":"Razoável","poor":"Ruim","service recommended":"Troca recomendada","replace soon":"Trocar em breve","replace now":"Trocar agora","service battery":"Precisa de manutenção","check battery":"Verificar bateria"};
const SMART_PT={"verified":"Saudável","failing":"Falhando","not supported":"Sem informação","about to fail":"Prestes a falhar"};
function fmtCores(v){ const m=String(v||"").match(/(\d+):(\d+):(\d+)/); return m?`${m[1]} núcleos (${m[2]} de desempenho e ${m[3]} de eficiência)`:(v?v+" núcleos":""); }
function sysData(){
  const S = window.SYSINFO; if(!S) return null;
  const sp = S.sp || {};
  const first = k => (sp[k]||[])[0] || {};
  const hw = first("SPHardwareDataType"), sw = first("SPSoftwareDataType");
  const pw = (sp.SPPowerDataType||[]).find(x=>x.sppower_battery_health_info) || {};
  const bh = pw.sppower_battery_health_info || {};
  const io = {};
  (S.batteryIoreg||"").split("\n").forEach(l=>{ const m=l.match(/"(\w+)" = (\d+)/); if(m) io[m[1]]=+m[2]; });
  let maxCap = parseInt(bh.sppower_battery_health_maximum_capacity) || NaN;
  if(isNaN(maxCap) && io.DesignCapacity && (io.AppleRawMaxCapacity||io.MaxCapacity>100))
    maxCap = Math.round(100*(io.AppleRawMaxCapacity||io.MaxCapacity)/io.DesignCapacity);
  const storage = (sp.SPStorageDataType||[]).find(v=>v.mount_point==="/") || (sp.SPStorageDataType||[])[0] || {};
  const nvme = ((sp.SPNVMeDataType||[])[0]||{})._items?.[0] || {};
  const smart = (storage.physical_drive||{}).smart_status || nvme.smart_status || (S.smartDiskutil||"").split(":").slice(1).join(":").trim();
  const disp = ((sp.SPDisplaysDataType||[])[0]||{}).spdisplays_ndrvs || [];
  const internal = disp.find(d=>/internal|built-in/i.test((d.spdisplays_connection_type||"")+(d.spdisplays_display_type||"")+(d._name||""))) || disp[0] || {};
  const res = (internal._spdisplays_resolution || internal.spdisplays_resolution || "").replace(/ x /," × ").replace(/Retina/,"(Retina)");
  const cams = (sp.SPCameraDataType||[]).map(c=>c._name).join(", ");
  const gb = b => b ? Math.round(b/1e9)+" GB" : "";
  const al = hw.activation_lock_status || "";
  const alEnabled = /enabled/i.test(al), mdm=S.mdm||"";
  const mdmYes = /MDM enrollment: Yes|Enrolled via DEP: Yes/i.test(mdm);
  const cond = bh.sppower_battery_health || "";
  const cycles = +(bh.sppower_battery_cycle_count ?? io.CycleCount ?? NaN);
  return {
    model: hw.machine_name||"Mac", chip: hw.chip_type || hw.cpu_type || "", ram: hw.physical_memory||"", disk: gb(storage.size_in_bytes),
    rows:[
      ["Modelo", [hw.machine_name, hw.model_number].filter(Boolean).join(" · ")],
      ["Identificador", hw.machine_model],
      ["Processador", hw.chip_type || [hw.cpu_type, hw.current_processor_speed].filter(Boolean).join(" ")],
      ["Núcleos", fmtCores(hw.number_processors)],
      ["Memória RAM", hw.physical_memory],
      ["Armazenamento", [gb(storage.size_in_bytes), storage.free_space_in_bytes ? gb(storage.free_space_in_bytes)+" livres":""].filter(Boolean).join(" · ")],
      ["Número de série", hw.serial_number],
      ["Sistema", (sw.os_version||"").replace(/\s*\(.*\)/,"")],
      ["Tela", [/color lcd|built-in/i.test(internal._name||"")?"Tela integrada":internal._name, res].filter(Boolean).join(" · ")],
      ["Câmera", cams],
      ["Ciclos de carga", isNaN(cycles)?"":cycles],
      ["Condição da bateria", BATT_PT[cond.toLowerCase()]||cond],
      ["Capacidade da bateria", isNaN(maxCap)?"":maxCap+"% da original"],
      ["Saúde do SSD", SMART_PT[String(smart).toLowerCase()]||smart],
      ["Bloqueio de Ativação (iCloud)", al ? (alEnabled?"Ligado ⚠️":"Desligado ✓") : ""],
      ["Gerenciado por empresa", mdm ? (mdmYes?"Sim ⚠️":"Não ✓") : ""],
    ].filter(r=>r[1]!==undefined && r[1]!==""),
    cycles, condition:cond, maxCap, smart, alEnabled, mdmYes, raw:S, generatedAt:S.generatedAt
  };
}
function sysAlerts(d){
  const a=[];
  if(d.alEnabled) a.push(["bad","<b>Bloqueio de Ativação ligado.</b> O Mac está preso à conta iCloud de alguém. Só compre se o vendedor sair da conta e desligar o Buscar Mac na sua frente."]);
  if(d.mdmYes) a.push(["bad","<b>Mac de empresa.</b> Ele é gerenciado à distância e pode ser bloqueado ou apagado a qualquer momento."]);
  if(d.smart && !/verified/i.test(d.smart)) a.push(["bad","<b>SSD com problema</b> ("+esc(SMART_PT[String(d.smart).toLowerCase()]||d.smart)+"). Risco de perder tudo."]);
  if(d.condition && !/normal|good/i.test(d.condition)) a.push(["warn","<b>Bateria:</b> "+esc(BATT_PT[d.condition.toLowerCase()]||d.condition)+". Conte com o custo da troca."]);
  if(d.maxCap && d.maxCap<80) a.push(["warn","<b>Bateria em "+d.maxCap+"%</b> da capacidade original. Abaixo de 80% a Apple recomenda trocar."]);
  if(d.cycles>1000) a.push(["warn","<b>"+d.cycles+" ciclos de carga.</b> Passou do limite de 1.000 que a Apple indica."]);
  else if(d.cycles>700) a.push(["warn","<b>"+d.cycles+" ciclos de carga.</b> Já é bastante uso. Dá pra negociar o preço."]);
  if(!a.length) a.push(["good","Nada de errado nos dados do sistema. Bateria, SSD e bloqueios estão em ordem."]);
  return a;
}
function batteryColor(p){ return p>=85?"var(--ok)":p>=80?"var(--warn)":"var(--fail)"; }
const NO_DATA = `${note("warn","<b>Sem os dados do Mac.</b> Esta página não foi aberta pelo comando do Terminal.")}
  <p>No Mac que você vai vistoriar, abra o <b>Terminal</b> e digite:</p>
  <pre>curl -fsSL https://raw.githubusercontent.com/vianx7/macbook-checker/main/install.sh | bash</pre>
  <p class="muted" style="margin-bottom:0">Sem Terminal? Os mesmos dados ficam em  → Sobre Este Mac → Mais Informações → Relatório do Sistema.</p>`;

const PAGES = {};
PAGES.sistema = m=>{
  pageHead(m,"sistema","Dados lidos direto do Mac pelo comando do Terminal.");
  const d = sysData();
  if(!d){ m.append(h(`<div class="card">${NO_DATA}</div>`)); m.append(verdict("sistema")); return; }
  const top=h(`<div class="grid g3" style="margin-bottom:14px"></div>`);
  top.append(h(`<div class="card"><div class="label">Este Mac</div><div class="num" style="font-size:30px;margin:8px 0 6px">${esc(d.model)}</div><div class="muted">${esc([d.chip,d.ram,d.disk].filter(Boolean).join(" · "))}</div></div>`));
  top.append(h(`<div class="card" style="display:flex;gap:18px;align-items:center">
    <div class="gauge" style="--p:${isNaN(d.maxCap)?0:d.maxCap};--c:${batteryColor(d.maxCap)}"><div><b>${isNaN(d.maxCap)?"—":d.maxCap+"%"}</b><small>da original</small></div></div>
    <div><div class="label">Bateria</div><div class="num" style="font-size:30px">${isNaN(d.cycles)?"—":d.cycles}</div><div class="muted">ciclos de carga</div></div></div>`));
  const ok=!d.alEnabled && !d.mdmYes;
  top.append(h(`<div class="card"><div class="label">Bloqueios</div><div class="num" style="font-size:30px;margin:8px 0 6px;color:${ok?"var(--ok)":"var(--fail)"}">${ok?"Livre":"Bloqueado"}</div><div class="muted">iCloud ${d.alEnabled?"ligado":"desligado"} · ${d.mdmYes?"Mac de empresa":"Mac pessoal"}</div></div>`));
  m.append(top);
  const al=h(`<div class="card"><h3>O que a vistoria encontrou</h3></div>`);
  sysAlerts(d).forEach(([c,t])=>al.insertAdjacentHTML("beforeend",note(c,t)));
  m.append(al);
  const tb=h(`<div class="card"><h3>Ficha completa</h3><div class="kv"></div><p class="muted" style="margin:14px 0 0;font-size:13px">Lido em ${esc(d.generatedAt)}. Confira se o número de série bate com a caixa e veja a garantia em checkcoverage.apple.com.</p></div>`);
  d.rows.forEach(([k,v])=>$(".kv",tb).insertAdjacentHTML("beforeend",`<div>${esc(k)}</div><div>${esc(v)}</div>`));
  m.append(tb);
  m.append(h(`<details class="card"><summary>Ver dados técnicos completos</summary><pre>${esc(JSON.stringify(d.raw,null,1))}</pre></details>`));
  if(!state.results.sistema){ const al2=sysAlerts(d); state.results.sistema = al2.some(x=>x[0]==="bad")?"fail":al2.some(x=>x[0]==="warn")?"warn":"ok"; save(); }
  m.append(verdict("sistema"));
};

/* ================= início ================= */
PAGES.inicio = m=>{
  const d=sysData(), n=doneCount(), fails=STEPS.filter(t=>statusOf(t.id)==="fail").length;
  const nextT=STEPS.find(t=>statusOf(t.id)==="pending");
  m.append(h(`<div><p class="eyebrow">${n?"Bora continuar?":"Pronto pra começar?"}</p><h1 class="hello">${d?"Vistoria do "+esc(d.model):"Vistoria do MacBook"}</h1></div>`));
  const g=h(`<div class="grid g4"></div>`);
  g.append(h(`<div class="card"><div class="label">Progresso</div><div class="num" style="margin:10px 0 14px">${n}<small> de ${STEPS.length}</small></div>
    <div class="ticks">${STEPS.map(t=>{const s=statusOf(t.id);return `<i class="${s==="ok"?"on":s==="fail"?"fail":s==="warn"?"warn":""}"></i>`;}).join("")}</div></div>`));
  g.append(h(`<div class="card"><div class="label">Problemas encontrados</div><div class="num" style="margin:10px 0 6px;color:${fails?"var(--fail)":"inherit"}">${fails}</div><div class="muted">${fails?"Veja no relatório":"Nenhum até agora"}</div></div>`));
  if(d){
    g.append(h(`<div class="card" style="display:flex;gap:16px;align-items:center"><div class="gauge" style="--p:${isNaN(d.maxCap)?0:d.maxCap};--c:${batteryColor(d.maxCap)};width:92px;height:92px"><div style="width:74px;height:74px"><b style="font-size:20px">${isNaN(d.maxCap)?"—":d.maxCap+"%"}</b></div></div>
      <div><div class="label">Bateria</div><div style="font-weight:600;font-size:18px">${isNaN(d.cycles)?"—":d.cycles} ciclos</div><div class="muted" style="font-size:13px">${esc(BATT_PT[(d.condition||"").toLowerCase()]||d.condition||"")}</div></div></div>`));
    const ok=!d.alEnabled && !d.mdmYes;
    g.append(h(`<div class="card"><div class="label">iCloud e empresa</div><div class="num" style="margin:10px 0 6px;font-size:32px;color:${ok?"var(--ok)":"var(--fail)"}">${ok?"Livre":"Bloqueado"}</div><div class="muted">${ok?"Pode ser formatado e usado":"Não compre assim"}</div></div>`));
  } else {
    g.append(h(`<div class="card" style="grid-column:span 2"><div class="label">Ficha do Mac</div><p style="margin:10px 0 0">Abra pelo comando do Terminal para ver bateria, SSD e bloqueios. Os outros testes funcionam normalmente.</p></div>`));
  }
  m.append(g);
  if(d){ const bad=sysAlerts(d).filter(a=>a[0]==="bad"); if(bad.length){ const c=h(`<div class="card" style="margin-top:14px"></div>`); bad.forEach(([k,t])=>c.insertAdjacentHTML("beforeend",note(k,t))); m.append(c);} }
  const cta=h(`<div class="row" style="margin:22px 0 0"><button class="btn primary lg">${nextT?(n?"Continuar: ":"Começar: ")+nextT.name:"Ver relatório final"}${ico("next")}</button><span class="muted">${nextT?"Leva uns 15 minutos no total.":"Tudo testado! 🎉"}</span></div>`);
  cta.querySelector("button").onclick=()=>go(nextT?nextT.id:"relatorio"); m.append(cta);
  const card=t=>{ const s=statusOf(t.id), i=STEPS.indexOf(t)+1, hl=nextT&&t.id===nextT.id;
    const el=h(`<div class="card tcard ${hl?"hl":""}"><div class="row" style="justify-content:space-between"><div class="ticon">${ico(t.icon)}</div><button class="circle" style="width:36px;height:36px">${ico("arrow")}</button></div>
      <div><div class="t">${i}. ${t.name}</div><div class="d">${t.desc}</div></div>
      <div class="foot">${hl?`<span style="font-weight:600;font-size:13px">Próximo teste</span>`:`<span class="tag ${s}">${LBL[s]}</span>`}</div></div>`);
    el.onclick=()=>go(t.id); return el; };
  m.append(h(`<div class="section-t"><h2>Testes básicos</h2><span class="muted">faça primeiro</span></div>`));
  const gb=h(`<div class="grid g4"></div>`); STEPS.filter(t=>!t.adv).forEach(t=>gb.append(card(t))); m.append(gb);
  m.append(h(`<div class="section-t"><h2>Testes avançados</h2><span class="muted">deixe pro final</span></div>`));
  const ga=h(`<div class="grid g4"></div>`); STEPS.filter(t=>t.adv).forEach(t=>ga.append(card(t))); m.append(ga);
};

/* ================= teclado ================= */
const F = n=>({c:"F"+n,l:"F"+n,fn:1});
const KB = [
  [{c:"Escape",l:"esc",fn:1,w:1.4},F(1),F(2),F(3),F(4),F(5),F(6),F(7),F(8),F(9),F(10),F(11),F(12)],
  [["Backquote","`"],["Digit1","1"],["Digit2","2"],["Digit3","3"],["Digit4","4"],["Digit5","5"],["Digit6","6"],["Digit7","7"],["Digit8","8"],["Digit9","9"],["Digit0","0"],["Minus","-"],["Equal","="],{c:"Backspace",l:"⌫",w:1.6}],
  [{c:"Tab",l:"⇥",w:1.6},..."QWERTYUIOP".split("").map(x=>["Key"+x,x]),["BracketLeft","["],["BracketRight","]"],{c:"Backslash",l:"\\",w:1.0}],
  [{c:"CapsLock",l:"⇪",w:1.9},..."ASDFGHJKL".split("").map(x=>["Key"+x,x]),["Semicolon","Ç ;"],["Quote","'"],{c:"Enter",l:"↩",w:1.9}],

let actx=null;
const ac=()=>{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); return actx; };
function tone({pan=0,freq=440,dur=1.2,sweep=0,type="sine"}){
  const a=ac(), o=a.createOscillator(), g=a.createGain(), t=a.currentTime;
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(sweep) o.frequency.exponentialRampToValueAtTime(sweep,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.35,t+.05); g.gain.setValueAtTime(.35,t+dur-.08); g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g);
  if(a.createStereoPanner){ const p=a.createStereoPanner(); p.pan.value=pan; g.connect(p); p.connect(a.destination); }
  else g.connect(a.destination);
  o.start(t); o.stop(t+dur+.02); return o;
}
/* música de teste original, gerada aqui mesmo: bateria, baixo, acordes e arpejo */
const Music=(()=>{
  let a=null, master=null, panner=null, analyser=null, timer=0, step=0, next=0, noise=null, playing=false, pan=0, vol=.8;
  const S=60/100/4;
  const mf=n=>440*Math.pow(2,(n-69)/12);
  const PROG=[[36,[60,64,67]],[43,[59,62,67]],[45,[60,64,69]],[41,[60,65,69]]];
  const ARP=[0,1,2,1,0,2,1,2];
  function note(t,f,d,type,g,lp){ const o=a.createOscillator(), e=a.createGain(); o.type=type; o.frequency.value=f;
    e.gain.setValueAtTime(0,t); e.gain.linearRampToValueAtTime(g,t+.012); e.gain.exponentialRampToValueAtTime(.0001,t+d);
    let n=o; if(lp){ const fl=a.createBiquadFilter(); fl.type="lowpass"; fl.frequency.value=lp; o.connect(fl); n=fl; }
    n.connect(e); e.connect(master); o.start(t); o.stop(t+d+.05); }
  function kick(t){ const o=a.createOscillator(), e=a.createGain(); o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(40,t+.2);
    e.gain.setValueAtTime(1,t); e.gain.exponentialRampToValueAtTime(.001,t+.4); o.connect(e); e.connect(master); o.start(t); o.stop(t+.45); }
  function hit(t,d,g,hp){ const s=a.createBufferSource(); s.buffer=noise; const f=a.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    const e=a.createGain(); e.gain.setValueAtTime(g,t); e.gain.exponentialRampToValueAtTime(.001,t+d); s.connect(f); f.connect(e); e.connect(master); s.start(t); s.stop(t+d+.02); }
  function tick(){
    while(next < a.currentTime+.2){
      const t=next, s=step%16, [root,ch]=PROG[Math.floor(step/16)%4];
      if(s===0||s===8||s===10) kick(t);
      if(s===4||s===12){ hit(t,.18,.5,1200); note(t,180,.08,"triangle",.25); }
      if(s%2===0) hit(t,.05,s%4===2?.22:.12,7000);
      if(s%2===0) note(t,mf(root+(s===6||s===14?12:0)),S*1.7,"sawtooth",.32,520);
      if(s===0) ch.forEach(n=>note(t,mf(n),S*16,"triangle",.07,1800));
      if(s%2===0) note(t,mf(ch[ARP[s/2]]+12),S*1.6,"triangle",.13);
      if(Math.floor(step/16)%2===1 && (s===0||s===3||s===6)) note(t,mf(ch[s/3]+24),S*2.5,"sine",.09);
      next+=S; step++;
    }
  }
  return {
    get playing(){ return playing; }, get analyser(){ return analyser; },
    start(){ if(playing) return; a=ac();
      if(!noise){ noise=a.createBuffer(1,a.sampleRate,a.sampleRate); const d=noise.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
      master=a.createGain(); master.gain.value=vol*.55; analyser=a.createAnalyser(); analyser.fftSize=64; master.connect(analyser);
      panner=a.createStereoPanner ? a.createStereoPanner() : null;
      if(panner){ panner.pan.value=pan; master.connect(panner); panner.connect(a.destination); } else master.connect(a.destination);
      step=0; next=a.currentTime+.06; tick(); timer=setInterval(tick,25); playing=true; },
    stop(){ if(!playing) return; clearInterval(timer); const m=master; m.gain.setTargetAtTime(0,a.currentTime,.04); setTimeout(()=>m.disconnect(),400); playing=false; },
    setPan(p){ pan=p; if(panner) panner.pan.setTargetAtTime(p,a.currentTime,.015); },
    setVol(v){ vol=v; if(master) master.gain.setTargetAtTime(v*.55,a.currentTime,.03); },
    get canPan(){ return !!(window.AudioContext||window.webkitAudioContext).prototype.createStereoPanner; }
  };
})();

function mediaErr(err,what){
  const n=err&&err.name;
  if(n==="NotAllowedError"||n==="SecurityError") return `Sem permissão para usar o ${what}. Libere em Ajustes do Sistema → Privacidade e Segurança → ${what==="microfone"?"Microfone":"Câmera"}, marque o navegador e recarregue a página.`;
  if(n==="NotFoundError") return `Não encontrei nenhum ${what} neste Mac.`;
  if(n==="NotReadableError") return `O ${what} está sendo usado por outro app (FaceTime, Zoom…). Feche e tente de novo.`;
  return `Não consegui ligar o ${what}. Tente no Safari ou no Chrome.`;
}

        $("#lvl").style.width=Math.min(100,rms*400)+"%"; raf=requestAnimationFrame(loop); };

    }catch(err){ c.insertAdjacentHTML("afterbegin",note("bad",mediaErr(err,"microfone"))); }
  };
  $("#rec",c).onclick=()=>{
    if(!window.MediaRecorder){ $("#msg",c).textContent="Este navegador não grava. Use o Chrome ou o app Gravador."; return; }
    const r=new MediaRecorder(stream), chunks=[]; r.ondataavailable=e=>chunks.push(e.data);
    r.onstop=()=>{ const au=$("#playb",c); au.src=URL.createObjectURL(new Blob(chunks,{type:r.mimeType})); au.style.display="block"; au.play(); $("#msg",c).textContent="Escute a gravação ↓"; };
    r.start(); let n=5; $("#msg",c).textContent="Gravando… 5";
    const iv=setInterval(()=>{ n--; if(n<=0){clearInterval(iv); r.stop();} else $("#msg",c).textContent="Gravando… "+n; },1000);
  };
  cleanup=()=>{ cancelAnimationFrame(raf); stream&&stream.getTracks().forEach(t=>t.stop()); };
  m.append(verdict("mic"));
};

/* ================= servidor local (testes avançados) ================= */
async function api(name,q){
  let r;
  try{ r=await fetch("/api/"+name+(q?"?"+q:""),{cache:"no-store"}); }catch(e){ throw new Error("sem servidor"); }
  if(!r.ok) throw new Error("sem servidor");
  try{ return await r.json(); }catch(e){ throw new Error("sem servidor"); }
}
const NO_SERVER=note("warn","<b>Este teste precisa do comando do Terminal.</b> É ele que roda os testes por baixo. Abra o Terminal e rode o comando da Vistoria Mac de novo.");
function fmtAgo(sec){ const d=Math.floor(sec/86400); return d<1?"hoje":d===1?"ontem":d<60?`há ${d} dias`:d<730?`há ${Math.round(d/30)} meses`:`há ${Math.round(d/365)} anos`; }
function findAll(o,fn,out=[]){ if(o&&typeof o==="object"){ if(fn(o)) out.push(o); for(const k in o) findAll(o[k],fn,out); } return out; }

/* ================= portas e estado ================= */
PAGES.extras = m=>{
  pageHead(m,"extras","Primeiro as portas (a página detecta sozinha), depois o que dá pra ver no olho.");
  const live=h(`<div class="card"><h3>${ico("bolt")}Portas ao vivo</h3>
    <p class="muted" style="margin-top:-6px">Plugue o carregador em <b>cada porta USB-C</b>, uma de cada vez, e veja se aparece "Na tomada". Depois plugue um pendrive, HD ou o seu celular em cada porta e veja se ele aparece na lista.</p>
    <div class="grid g3"><div class="card" style="background:var(--surface-2);box-shadow:none"><div class="label">Energia</div><div class="num" style="font-size:28px;margin-top:6px" id="pw">…</div></div>
      <div class="card" style="background:var(--surface-2);box-shadow:none"><div class="label">Bateria</div><div class="num" style="font-size:28px;margin-top:6px" id="bt">…</div></div>
      <div class="card" style="background:var(--surface-2);box-shadow:none"><div class="label">Carregador</div><div class="num" style="font-size:28px;margin-top:6px" id="wt">—</div></div></div>
    <div style="margin-top:16px"><span class="label">Aparelhos USB conectados</span><div id="usb" style="margin-top:6px">…</div></div>
    <p class="muted" style="margin:14px 0 0;font-size:13px">Com o "carregamento otimizado" ligado, o Mac pode segurar a bateria em 80% e dizer que não está carregando. É normal: o que importa é aparecer "Na tomada".</p></div>`);
  m.append(live);
  let alive=true; const timers=[];
  const ST={charging:"carregando",discharging:"descarregando",charged:"carregada","ac attached":"não está carregando","finishing charge":"quase cheia"};
  const pollPower=async()=>{ try{ const r=await api("power");
      const acp=/AC Power/i.test(r.batt), pct=(r.batt.match(/(\d+)%/)||[])[1], st=((r.batt.match(/\d+%;\s*([^;]+);/)||[])[1]||"").trim().toLowerCase();
      const w=(r.ac.match(/Wattage\s*=\s*(\d+)/i)||[])[1];
      $("#pw",live).innerHTML=acp?`<span style="color:var(--ok)">Na tomada</span>`:"Na bateria";
      $("#bt",live).innerHTML=(pct?pct+"%":"—")+(st?` <small>${esc(ST[st]||st)}</small>`:"");
      $("#wt",live).textContent=acp&&w?w+" W":"—";
    }catch(e){ live.innerHTML=`<h3>${ico("bolt")}Portas ao vivo</h3>`+NO_SERVER; alive=false; } };
  const pollUsb=async()=>{ if(!alive) return; try{ const r=await api("usb"); let names=[];
      try{ const j=JSON.parse(r.json||"{}"); names=findAll(j,o=>o._name && !o._items && !/bus|controller|hub|root/i.test(o._name)).map(o=>o._name); }catch(e){}
      const el=$("#usb",live); if(el) el.innerHTML=names.length?names.map(n=>`<span class="pill">${ico("usb")}${esc(n)}</span>`).join(""):"<span class='muted'>Nenhum por enquanto</span>";
    }catch(e){} };
  pollPower(); pollUsb(); timers.push(setInterval(pollPower,2500), setInterval(pollUsb,4000));
  cleanup=()=>timers.forEach(clearInterval);

  const c=h(`<div class="card"><h3>Checklist</h3><div id="ml"></div></div>`); m.append(c);
  const draw=()=>{ const l=$("#ml",c); l.innerHTML=""; MANUAL.forEach(([k,t,d])=>{ const v=state.manual[k];
    const row=h(`<div class="mitem"><div class="t">${esc(t)}<small>${esc(d)}</small></div><div class="mini">
      <button class="${v==="ok"?"ok":""}">OK</button><button class="${v==="fail"?"fail":""}">Defeito</button><button class="${v==="na"?"na":""}">Não tem</button></div></div>`);
    const [a,b,n]=row.querySelectorAll("button");
    a.onclick=()=>{state.manual[k]="ok";save();draw();}; b.onclick=()=>{state.manual[k]="fail";save();draw();}; n.onclick=()=>{state.manual[k]="na";save();draw();};
    l.append(row); }); };
  draw();
  const nx=h(`<div class="verdict"><span class="q">Básico concluído!</span><span class="muted">Agora os testes avançados.</span><span class="spacer"></span><button class="btn primary">Próximo: Travamentos${ico("next")}</button></div>`);
  nx.querySelector("button").onclick=()=>go("travamentos"); m.append(nx);
};

/* ================= travamentos ================= */
PAGES.travamentos = m=>{
  pageHead(m,"travamentos","Procura registros de quando o Mac travou feio e reiniciou sozinho. É o melhor jeito de achar defeito de placa que o vendedor não conta.");
  const c=h(`<div class="card"><p class="muted" style="margin:0">Verificando…</p></div>`); m.append(c);
  api("panics").then(r=>{
    const recent=r.panics.filter(p=>r.now-p.time<90*86400);
    const setupAgo=r.setupDone? r.now-r.setupDone : null;
    let html=`<div class="row" style="gap:30px;margin-bottom:6px"><div><div class="label">Reinícios por travamento</div><div class="num" style="color:${recent.length?"var(--fail)":r.panics.length?"var(--warn)":"var(--ok)"}">${r.panics.length}</div></div>
      <div><div class="label">Nos últimos 3 meses</div><div class="num">${recent.length}</div></div><div><div class="label">Apps que fecharam sozinhos</div><div class="num">${r.crashes}</div></div></div>`;
    if(!r.readable) html+=note("warn","Não consegui ler os registros (a conta aberta não é de administrador). Resultado inconclusivo.");
    else if(!r.panics.length) html+=note("good","Nenhum travamento grave registrado.");
    else if(recent.length) html+=note("bad",`<b>${recent.length>1?recent.length+" travamentos":"1 travamento"} nos últimos 3 meses.</b> Pergunte ao vendedor e desconfie: pode ser defeito de placa, memória ou SSD.`);
    else html+=note("warn",`${r.panics.length>1?r.panics.length+" travamentos antigos":"1 travamento antigo"}, nenhum nos últimos 3 meses.`);
    if(setupAgo!==null) html+=note(setupAgo<30*86400?"warn":"info",`O macOS foi configurado <b>${fmtAgo(setupAgo)}</b>.${setupAgo<30*86400?" Como foi formatado há pouco, o histórico está quase vazio e este teste diz pouco. Capriche no teste de estresse.":""}`);
    if(r.panics.length) html+=`<div class="kv" style="margin-top:10px">${r.panics.slice(0,12).map(p=>`<div>${new Date(p.time*1000).toLocaleString("pt-BR")}</div><div class="faint" style="font-size:13px">${esc(p.name)}</div>`).join("")}</div>`;
    if(r.reboots) html+=`<details style="margin-top:12px"><summary>Últimos desligamentos e reinícios</summary><pre>${esc(r.reboots)}</pre></details>`;
    c.innerHTML=html;
    if(!state.results.travamentos && r.readable) setResult("travamentos", recent.length?"fail":r.panics.length?"warn":"ok");
    setDetail("travamentos", r.panics.length? `${r.panics.length} travamento${r.panics.length>1?"s":""}, ${recent.length} recente${recent.length===1?"":"s"}` : "nenhum travamento");
  }).catch(()=>c.innerHTML=NO_SERVER);
  m.append(verdict("travamentos"));
};

    $("#msg",c).textContent="Rodando… não feche esta página.";
    try{ const r=await api("stress","s="+S); if(r.error) throw new Error(r.error);

      $("#res",c).innerHTML=note("good",`Aguentou ${r.secs} segundos com os ${r.cpus} núcleos no máximo, sem travar.`)+

/* ================= relatório ================= */
function overall(){
  const all=STEPS.map(t=>statusOf(t.id)), d=sysData();
  const fails=all.filter(s=>s==="fail").length, warns=all.filter(s=>s==="warn").length, pend=all.filter(s=>s==="pending").length;
  const critical=d&&(d.alEnabled||d.mdmYes);
  if(critical) return {k:"fail",t:"Não compre",s:"O Mac está bloqueado por iCloud ou empresa."};
  if(fails) return {k:"fail",t:"Tem defeito",s:`${fails} ${fails>1?"itens":"item"} com defeito. Use isso pra negociar ou desista.`};
  if(pend) return {k:"pending",t:"Em andamento",s:pend>1?`Faltam ${pend} testes.`:"Falta 1 teste."};
  if(warns) return {k:"warn",t:"Aprovado com ressalvas",s:"Funciona, mas tem pontos de atenção. Dá pra negociar."};
  return {k:"ok",t:"Aprovado",s:"Tudo funcionando. Pode comprar tranquilo."};
}
function reportText(){
  const d=sysData(), o=overall(); const L=[];
  L.push("VISTORIA MAC — "+new Date().toLocaleString("pt-BR"),"Resultado: "+o.t+" — "+o.s,"");
  if(d){ d.rows.forEach(([k,v])=>L.push(k+": "+v)); L.push(""); sysAlerts(d).forEach(a=>L.push("• "+a[1].replace(/<[^>]+>/g,""))); }
  L.push(""); STEPS.filter(t=>t.id!=="extras").forEach(t=>L.push(t.name+": "+LBL[statusOf(t.id)]+(state.details[t.id]?" ("+state.details[t.id]+")":"")));
  L.push("","Checklist:"); MANUAL.forEach(([k,t])=>L.push("  "+t+": "+LBL[state.manual[k]||"pending"]));
  if(state.notes) L.push("", "Observações: "+state.notes);
  return L.join("\n");
}
PAGES.relatorio = m=>{
  pageHead(m,"relatorio","O resumo de tudo. Dá pra copiar e mandar no WhatsApp ou salvar em PDF.");
  const o=overall(), n=doneCount(), p=Math.round(100*n/STEPS.length), col={ok:"var(--ok)",fail:"var(--fail)",warn:"var(--warn)",pending:"var(--muted)"}[o.k];
  m.append(h(`<div class="card score"><div class="gauge" style="--p:${p};--c:${col}"><div><b>${n}/${STEPS.length}</b><small>testados</small></div></div>
    <div><div class="label">Resultado da vistoria</div><div class="big" style="color:${col};margin:6px 0">${o.t}</div><div class="muted">${o.s}</div></div></div>`));
  const g=h(`<div class="grid g2"></div>`);
  const mk=(title,list)=>{ const c=h(`<div class="card"><h3>${title}</h3></div>`); list.forEach(t=>{ const s=statusOf(t.id);
    const r=h(`<div class="rl"><div class="ticon">${ico(t.icon)}</div><div class="n">${t.name}${state.details[t.id]?`<small>${esc(state.details[t.id])}</small>`:""}</div><span class="tag ${s}">${LBL[s]}</span></div>`);
    r.onclick=()=>go(t.id); c.append(r); }); return c; };
  g.append(mk("Testes básicos",STEPS.filter(t=>!t.adv)));
  const right=mk("Testes avançados",STEPS.filter(t=>t.adv));
  const bad=MANUAL.filter(([k])=>state.manual[k]==="fail");
  if(bad.length){ right.insertAdjacentHTML("beforeend",`<h3 style="margin-top:20px">Defeitos do checklist</h3>`); bad.forEach(([k,t])=>right.insertAdjacentHTML("beforeend",`<div class="rl" style="cursor:default"><div class="n">${esc(t)}</div><span class="tag fail">Com defeito</span></div>`)); }
  g.append(right); m.append(g);
  const nt=h(`<div class="card" style="margin-top:14px"><h3>Observações</h3><textarea placeholder="Ex.: risco na tampa, tecla E meio dura, vendedor aceitou baixar R$ 300…"></textarea>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="copy">${ico("copy")}Copiar relatório</button><button class="btn" id="print">${ico("print")}Salvar em PDF</button><span class="spacer"></span><button class="btn" id="reset">Apagar tudo e recomeçar</button></div></div>`);
  m.append(nt);
  const ta=$("textarea",nt); ta.value=state.notes||""; ta.oninput=()=>{state.notes=ta.value; persist();};
  $("#copy",nt).onclick=async()=>{ try{ await navigator.clipboard.writeText(reportText()); $("#copy",nt).innerHTML=ico("check")+"Copiado!"; }catch(e){ prompt("Copie o texto:",reportText()); } };
  $("#print",nt).onclick=()=>window.print();
  $("#reset",nt).onclick=()=>{ if(confirm("Apagar todos os resultados e começar de novo?")){ state={results:{},manual:{},details:{},notes:""}; save(); go("inicio"); } };
};
